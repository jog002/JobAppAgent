name: Daily Job Search

on:
  schedule:
    # Run at 8:00 AM EST (1:00 PM UTC)
    # Note: GitHub Actions uses UTC timezone
    # During EDT (summer): runs at 9:00 AM local
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  batch-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create batch.env from secrets
        run: |
          cat > batch.env << 'ENVFILE'
          LLM_PROVIDER=claude
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=gpt-4.1
          OPENAI_TEMPERATURE=0.3
          OPENAI_MAX_TOKENS=2000
          OPENAI_INPUT_COST_PER_M=2.0
          OPENAI_OUTPUT_COST_PER_M=8.0
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL=claude-sonnet-4-20250514
          CLAUDE_TEMPERATURE=0.3
          CLAUDE_MAX_TOKENS=2000
          CLAUDE_INPUT_COST_PER_M=3.0
          CLAUDE_OUTPUT_COST_PER_M=15.0
          DATABASE_MODE=turso
          DATABASE_PATH=./data/jobs.db
          TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
          GREENHOUSE_API_ENABLED=true
          GREENHOUSE_POLL_CURATED=true
          LOG_LEVEL=INFO
          LOG_FILE=./logs/batch_agent.log
          SEARCH_KEYWORDS=software engineer
          SEARCH_LOCATIONS=Remote,New York
          MAX_RESULTS_PER_SEARCH=50
          MIN_DISPLAY_SCORE=60
          TOP_JOBS_LIMIT=20
          ENABLED_SOURCES=web_scraping
          WEB_SCRAPING_PLATFORMS=greenhouse,lever,bamboohr,ashby
          SCRAPING_DELAY_SECONDS=2.0
          ENABLED_DISCOVERY_PROVIDERS=jobspy,brave_search,serpapi,greenhouse_api
          BRAVE_API_KEY=${{ secrets.BRAVE_API_KEY }}
          BRAVE_SEARCH_FRESHNESS=day
          JOBSPY_SITES=glassdoor,indeed
          JOBSPY_HOURS_OLD=24
          LOCATION_TERMS=NY,New York,Remote,NYC,Jersey City
          SEARCH_MODE=combined
          LEVEL_TERMS=Software Engineer II,Software Engineer 2,SWE II,SWE 2,Software Developer II,Software Developer 2,Associate Software Engineer
          SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_PAGES=5
          SERPAPI_RECENCY=day
          SERPAPI_TARGET_SITE=greenhouse.io
          SERPAPI_START_PAGE=0
          EMAIL_ENABLED=true
          EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}
          SMTP_SERVER=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SENDER_EMAIL=${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD=${{ secrets.SMTP_SENDER_PASSWORD }}
          SMTP_USE_TLS=true
          ENVFILE
          sed -i 's/^          //' batch.env

      - name: Create required directories
        run: |
          mkdir -p data logs resume

      - name: Copy resume file
        run: |
          echo "${{ secrets.RESUME_CONTENT }}" > resume/oscar_resume.txt

      - name: Run batch job
        run: python main.py batch

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
